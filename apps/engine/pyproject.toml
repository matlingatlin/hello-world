[project]
name = "scio-engine"
version = "0.0.1"
description = "Scio engine — intake layers, matrix + multi-pass relay (later), extraction (later)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]
# The library's catalog in Postgres (B061). Optional: without it the engine
# reads the seed catalog, matches and assembles exactly as before — it just
# cannot KEEP anything it learns, and says so instead of pretending.
db = [
    "psycopg[binary]>=3.2",
]
# The preview's senses: screenshot, classified console, click resolution.
# Optional on purpose — the core and its tests run without a browser — but it
# was never DECLARED optional, only described as such in a docstring, so there
# was no way to install it and a design build died on the import.
# The browser itself is a separate step: `playwright install chromium`.
vision = [
    "playwright>=1.47",
]
# Real model SDKs — only needed when calling real models (keys in env).
providers = [
    "anthropic>=0.40",
    "openai>=1.55",
    "google-genai>=0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
