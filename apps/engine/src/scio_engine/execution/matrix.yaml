# Capability matrix — which models are best at which task, ranked.
#
# Data, not code: rankings shift monthly, so this file is meant to be edited
# without touching the engine. `rank` 1 = first choice (runs pass 1 and the
# final pass). cost is USD per 1M output tokens; latency is a coarse class.
#
# Adding a vendor: register a ModelProvider for it (execution/provider.py).

models:
  - id: claude-fable-5
    vendor: anthropic
    context_limit: 200000
    cost_per_mtok: 15.0
    latency: medium
    strength: Deep reasoning, long-horizon code work, careful review

  - id: claude-sonnet-5
    vendor: anthropic
    context_limit: 200000
    cost_per_mtok: 5.0
    latency: fast
    strength: Strong general coding at lower cost

  - id: claude-haiku-4-5-20251001
    vendor: anthropic
    context_limit: 200000
    cost_per_mtok: 1.0
    latency: fast
    strength: Cheap, quick passes and light edits

  - id: gpt-5
    vendor: openai
    context_limit: 400000
    cost_per_mtok: 10.0
    latency: medium
    strength: Broad general capability, good structured output

  - id: gemini-2.5-pro
    vendor: google
    context_limit: 1000000
    cost_per_mtok: 10.0
    latency: medium
    strength: Very large context, strong multimodal grounding

tasks:
  spec_extraction:
    description: Wizard answers -> typed spec + wholeness object
    ranking: [claude-fable-5, gpt-5, gemini-2.5-pro]

  architecture:
    description: Layer B — the whole, architecture graph, playbook
    ranking: [claude-fable-5, gpt-5, gemini-2.5-pro]

  codegen:
    description: Generate app code against the frozen contracts
    ranking: [claude-fable-5, claude-sonnet-5, gpt-5]

  review:
    description: Review, rewrite and complement a previous pass
    ranking: [gpt-5, claude-fable-5, gemini-2.5-pro]

  fix:
    description: Directed repair of a specific defect
    ranking: [claude-fable-5, claude-sonnet-5, gpt-5]

  design:
    description: Design generation and directed regeneration
    ranking: [claude-fable-5, gemini-2.5-pro, gpt-5]

  light_edit:
    description: Small, cheap changes — single pass by default
    ranking: [claude-haiku-4-5-20251001, claude-sonnet-5, claude-fable-5]
