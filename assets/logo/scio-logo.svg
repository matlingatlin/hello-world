<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="'Space Grotesk','IBM Plex Sans',sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap');
      .lab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;fill:#586268}
      .line{stroke:#93A1A6;fill:none}
    </style>
  </defs>

  <rect width="880" height="620" fill="#E7EBEA"/>
  <g class="line" stroke-width="1.5">
    <path d="M28 28 h16 M28 28 v16"/><path d="M852 592 h-16 M852 592 v-16"/>
  </g>

  <text x="40" y="56" fill="#14181C" font-size="20" font-weight="600">Scio — logo (final)</text>
  <text x="40" y="78" class="lab">concept B refined · tile monogram = the app's marking motif</text>
  <line x1="40" y1="96" x2="840" y2="96" class="line" stroke-width="1"/>

  <!-- ========== PRIMARY LOCKUP (light) ========== -->
  <text x="40" y="140" class="lab">PRIMARY · LIGHT</text>
  <g transform="translate(56,158)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#0B5563"/>
    <text x="36" y="52" text-anchor="middle" font-size="46" font-weight="600" fill="#F5F7F6">S</text>
    <text x="92" y="52" font-size="52" font-weight="600" fill="#14181C" letter-spacing="-1.5">Scio</text>
  </g>

  <!-- ========== PRIMARY LOCKUP (dark) ========== -->
  <text x="470" y="140" class="lab">PRIMARY · DARK</text>
  <g transform="translate(470,150)">
    <rect x="0" y="0" width="330" height="96" rx="12" fill="#121619"/>
    <g transform="translate(24,12)">
      <rect x="0" y="0" width="72" height="72" rx="16" fill="#3FA8B8"/>
      <text x="36" y="52" text-anchor="middle" font-size="46" font-weight="600" fill="#0B1416">S</text>
      <text x="92" y="52" font-size="52" font-weight="600" fill="#EAEEEF" letter-spacing="-1.5">Scio</text>
    </g>
  </g>

  <line x1="40" y1="290" x2="840" y2="290" class="line" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ========== ICON ONLY ========== -->
  <text x="40" y="330" class="lab">ICON</text>
  <g transform="translate(56,346)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0B5563"/>
    <text x="48" y="68" text-anchor="middle" font-size="60" font-weight="600" fill="#F5F7F6">S</text>
  </g>
  <g transform="translate(180,346)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#3FA8B8"/>
    <text x="48" y="68" text-anchor="middle" font-size="60" font-weight="600" fill="#0B1416">S</text>
  </g>

  <!-- ========== FAVICON SCALES ========== -->
  <text x="330" y="330" class="lab">FAVICON</text>
  <g transform="translate(330,346)">
    <rect x="0" y="18" width="48" height="48" rx="11" fill="#0B5563"/>
    <text x="24" y="52" text-anchor="middle" font-size="30" font-weight="600" fill="#F5F7F6">S</text>

    <rect x="70" y="34" width="32" height="32" rx="8" fill="#0B5563"/>
    <text x="86" y="58" text-anchor="middle" font-size="20" font-weight="600" fill="#F5F7F6">S</text>

    <rect x="120" y="42" width="24" height="24" rx="6" fill="#0B5563"/>
    <text x="132" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F7F6">S</text>

    <rect x="160" y="46" width="16" height="16" rx="4" fill="#0B5563"/>
    <text x="168" y="58.5" text-anchor="middle" font-size="10" font-weight="600" fill="#F5F7F6">S</text>
  </g>

  <line x1="40" y1="470" x2="840" y2="470" class="line" stroke-width="1"/>

  <!-- specs -->
  <text x="40" y="508" class="lab">SPECS</text>
  <text x="40" y="532" class="lab" fill="#14181C">tile #0B5563 (dark: #3FA8B8) · letter #F5F7F6 (dark: #0B1416) · wordmark Space Grotesk 600</text>
  <text x="40" y="552" class="lab" fill="#14181C">corner radius scales with size (16 @72, 22 @96, ~0.23×) · clear space = tile height ÷ 2</text>
  <text x="40" y="572" class="lab" fill="#14181C">the tile is the same shape as the in-app numbered annotation markers</text>
</svg>
